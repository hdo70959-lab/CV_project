[project]
name = "cv-project"
version = "0.1.0"
description = "Traditional image processing experiments for the INS3155 midterm"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-contrib-python-headless==5.0.0.93",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
